<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Get the Ballot</title>
<style>

.nn-side{background:#101a35;border-radius:8px;padding:8px 10px;font-size:13px;max-height:420px;overflow:auto}

@keyframes mq{to{transform:translateX(-100%)}}

:root:root:root{--bg:#0d1326;--fg:#e9eefc;--card:#16203f;--mut:#8d9bc2;--bd:#2b3a68;--nh:#4f8cff;--va:#ff5b66;--acc:#f5c542}
body{background:radial-gradient(900px 420px at 15% -10%,#1d3a8a66,transparent),radial-gradient(900px 420px at 95% 0,#8a1d3a55,transparent),var(--bg);background-attachment:fixed}
h1{letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}

@keyframes glow{50%{box-shadow:0 0 18px #f5c54299}}
.pill{background:linear-gradient(180deg,#1b2850,#121b3a);box-shadow:inset 0 1px 0 #fff1}
button.pill{cursor:pointer}
path{transition:fill .5s,stroke .2s}
.ev div{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.views{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.views button{padding:4px 10px;font-size:12px}
select,input,textarea{background:#101a38;color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.chip{display:inline-block;margin:3px;padding:3px 10px;border-radius:999px;font-size:12px;background:#101a38;color:var(--mut)}.chip.on{background:var(--acc);color:#241a00;font-weight:700}
.tag{color:var(--fg)}
.mg{animation:mg 1.4s ease-in-out infinite}@keyframes mg{50%{filter:drop-shadow(0 0 10px var(--gc)) brightness(1.4)}}.nn-body2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;padding:0 14px 10px}
@media(max-width:860px){.nn-body2{grid-template-columns:1fr}}
.ka{background:linear-gradient(160deg,#0a3ea8,#08246e);border:2px solid #ffffff33;border-radius:6px;overflow:hidden;animation:kin .5s both;font-family:Impact,"Arial Narrow",system-ui,sans-serif;color:#fff}

.ka-h{display:flex;background:#0b46c4}.ka-k{background:#fff;color:#0a2a7a;font-size:10px;font-weight:900;line-height:1.05;padding:5px 8px;text-align:center}

.ka-w .x{font-size:10px;color:#cfe0ff;margin-top:5px;letter-spacing:.05em}.ka-f{background:#06194f;color:#cfe0ff;font-size:10px;padding:4px 8px;letter-spacing:.1em}
.pc{padding:4px 0;border-bottom:1px solid #1d2a4f;font-size:12px}.pc.nx{color:#ffd93b;font-weight:700}.pc.dn{opacity:.45}
.ka.kv{background:linear-gradient(160deg,#c21b2b,#6e0d18)}.kv .ka-h{background:#d4202f}.kv .ka-p{background:radial-gradient(circle at 30% 30%,#ff8b95,#d3202f)}.kv .ka-f{background:#4a0910}.kv .ka-k,.kv .ka-o{color:#8c1320}
#mp path{cursor:pointer}#mp path:hover{filter:brightness(1.25)}
.zp{background:#0b1230;border:1px solid #2c3f6e;border-radius:8px;padding:10px;animation:kin .4s both}
.zt{display:inline-block;background:#fff;color:#0b1230;font-size:11px;font-weight:800;padding:2px 8px;margin:6px 0}
.zc{border:1px solid #2c3f6e;border-radius:8px;padding:10px;margin-top:8px}
.zbar{height:6px;background:#2a3350;border-radius:3px;margin:6px 0 10px}.zbar i{display:block;height:100%;background:#fff;border-radius:3px}
.zh2{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.06em;border-bottom:1px solid #2c3f6e;padding-bottom:4px}
.zr{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin-top:6px;border-left:6px solid}
#zct{max-height:250px;overflow:auto;font-size:12px}.zk{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:4px 0;border-bottom:1px solid #1d2a4f}
.ka.big .ka-k{font-size:15px;padding:8px 12px}.ka.big .ka-s{font-size:clamp(24px,6vw,44px)}.ka.big .ka-o{font-size:clamp(12px,2.4vw,18px);margin:12px}
.ka.big .ka-b{padding:0 12px 12px;gap:16px}.ka.big .ka-p{width:clamp(90px,24vw,210px);height:clamp(90px,24vw,210px)}.ka.big .ka-d{font-size:clamp(13px,3vw,24px)}
.ka.big .ka-w small{font-size:clamp(14px,3vw,24px)}.ka.big .ka-w .f{font-size:clamp(18px,4vw,34px)}.ka.big .ka-w .l{font-size:clamp(26px,6.5vw,62px)}.ka.big .ka-w .x{font-size:clamp(10px,2vw,15px)}.ka.big .ka-f{font-size:clamp(10px,2vw,14px);padding:6px 12px}
</style></head><body><main id="app"></main>
<script>
const D="AK,0,0,3,-10;ME,10,0,4,9;VT,9,1,3,35;NH,10,1,4,7;WA,0,2,12,19;ID,1,2,4,-33;MT,2,2,4,-16;ND,3,2,3,-33;MN,4,2,10,7;IL,5,2,19,17;WI,6,2,10,1;MI,7,2,15,3;NY,8,2,28,22;RI,9,2,4,20;MA,10,2,11,33;OR,0,3,8,14;NV,1,3,6,2;WY,2,3,3,-43;SD,3,3,3,-26;IA,4,3,6,-8;IN,5,3,11,-14;OH,6,3,17,-8;PA,7,3,19,1;NJ,8,3,14,16;CT,9,3,7,20;CA,0,4,54,30;UT,1,4,6,-20;CO,2,4,10,12;NE,3,4,5,-14;MO,4,4,10,-15;KY,5,4,8,-26;WV,6,4,4,-39;VA,7,4,13,9;MD,8,4,10,33;DE,9,4,3,19;AZ,1,5,11,-1;NM,2,5,5,11;KS,3,5,6,-15;AR,4,5,6,-28;TN,5,5,11,-23;NC,6,5,16,-2;SC,7,5,9,-12;DC,8,5,3,86;OK,3,6,7,-33;LA,4,6,8,-19;MS,5,6,6,-17;AL,6,6,9,-27;GA,7,6,16,1;HI,0,7,4,29;TX,3,7,40,-6;FL,8,7,30,-4";
const R=(a,b)=>a+Math.random()*(b-a),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),$=id=>document.getElementById(id);
const gauss=()=>(R(0,1)+R(0,1)+R(0,1)+R(0,1)-2)*1.7;
const EVT=[["Strong jobs report",1],["Factory closures hit the Rust Belt",-1],["Major endorsement from a former president",1],["Campaign gaffe dominates the news cycle",-1],["Hurricane response draws praise",1],["Scandal story breaks",-1]];
let S=null,sel=null;
function save(){try{localStorage.setItem("gtb",JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("gtb"))}catch(e){return null}}
function newGame(side,diff){const st={};D.split(";").forEach(r=>{const[c,x,y,ev,l]=r.split(",");st[c]={x:+x,y:+y,ev:+ev,lean:+l+R(-2,2),mom:0}});
S={side,diff,week:1,ap:3,st,pm:20+R(5,15),am:30,pc:R(4,9),pmed:R(4,9),log:["Campaign launched. 12 weeks to Election Day."],phase:"play"};sel=null;save();draw()}
const proj=()=>{let n=0,v=0,u=0;for(const k in S.st){const s=S.st[k];if(Math.abs(s.lean)<1.5)u+=s.ev;else if(s.lean>0)n+=s.ev;else v+=s.ev}return{n,v,u}};
function push(c,side,mag){const s=S.st[c];s.mom=cl(s.mom+side*mag,-15,15);if(Math.abs(mag)>1)s.age=0}
function act(t,c,me){const sd=me?S.side:-S.side,s=S.st[c],f=1.2-Math.min(Math.abs(s.lean),30)/40;
if(t=="rally"){const ch=me?S.pc:5+S.diff;push(c,sd,7*(.5+ch/10)*f);if(me)S.pm-=2;else S.am-=2}
else{const md=me?S.pmed:5+S.diff;push(c,sd,6*(.5+md/10)*f);if(me)S.pm-=3;else S.am-=3}}
function aiTurn(){const nz=[1.2,.6,.3,.1][S.diff];let ap=3;while(ap-->0){if(S.am<3){S.am+=R(2,4);continue}
let best=null,bs=-1;for(const c in S.st){const s=S.st[c],sc=s.ev*Math.exp(-Math.abs(s.lean)/8)*(1+nz*R(0,1.5))*(1+Math.max(0,s.mom*S.side)/15*.8)*(s.lean*-S.side>25?.3:1);if(sc>bs){bs=sc;best=c}}
act(S.am>=5&&Math.random()<.5?"ad":"rally",best,false)}}
function endWeek(){aiTurn();const e=EVT[Math.floor(R(0,EVT.length))],sg=e[1]*(Math.random()<.5?1:-1);
for(const c in S.st)push(c,1,0);let tot=0;for(const c in S.st){const s=S.st[c];if(Math.random()<.2||true)s.mom+=sg*R(0,1.5);const m=cl(s.mom,-15,15);s.lean+=m*.2;s.mom=0}
S.log.unshift("Week "+S.week+" results in. News: "+e[0]+" ("+(sg*S.side>0?"helped you":"hurt you")+").");
S.pm+=3;S.am+=3;S.week++;S.ap=3;if(S.week>12){S.phase="elec"}save();draw()}
function fund(){const m=$("app");let hits=0,t=8;m.innerHTML='<div class="card"><h2>Fundraising dinner</h2><p>Tap donors as fast as you can. <b id="tm">8</b>s left. Donors: <b id="ht">0</b></p><div id="fa" style="position:relative;height:260px;border:1px dashed var(--bd);border-radius:10px"><button id="tg" class="pri">Donor</button></div></div>';
const mv=()=>{const g=$("tg");g.style.left=R(0,70)+"%";g.style.top=R(0,80)+"%"};mv();$("tg").onclick=()=>{hits++;$("ht").textContent=hits;mv()};
const iv=setInterval(()=>{t--;$("tm").textContent=t;if(t<=0){clearInterval(iv);const r=hits*.45*(.8+S.pc/20);S.pm+=r;S.ap--;S.log.unshift("Fundraiser raised $"+r.toFixed(1)+"M.");save();draw()}},1000)}
function draw(){const a=$("app");if(!S){const o=load();a.innerHTML='<h1>🗳️ Get the Ballot</h1><div class="card"><p>A 12-week presidential campaign. Fictional parties, fictional polling. Pick your side:</p><p><select id="sd"><option value="1">New Horizon (centre-left)</option><option value="-1">Valor (centre-right)</option></select> <select id="df"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Hard</option><option value="3">Expert</option></select></p><button class="pri" id="go">New Election</button> '+(o&&o.phase?'<button id="ct">Continue</button>':'')+'</div>';
$("go").onclick=()=>newGame(+$("sd").value,+$("df").value);if($("ct"))$("ct").onclick=()=>{S=o;draw()};return}
if(S.phase=="elec")return elec();
const p=proj(),me=S.side>0?p.n:p.v,ai=S.side>0?p.v:p.n;
let h='<div class="card bar"><b>Week '+S.week+'/12</b><span>Funds $'+S.pm.toFixed(1)+'M</span><span>Actions '+S.ap+'</span><span style="color:var(--'+(S.side>0?'nh':'va')+')">You '+me+' EV</span><span style="color:var(--'+(S.side>0?'va':'nh')+')">Rival '+ai+' EV</span><span class="mut">Toss-up '+p.u+'</span></div><div class="grid">';
const cells={};for(const c in S.st){const s=S.st[c];cells[s.y*11+s.x]=c}
for(let i=0;i<88;i++){const c=cells[i];if(!c){h+='<div></div>';continue}const s=S.st[c],w=Math.min(100,25+Math.abs(s.lean)*3);
h+='<button class="t'+(sel==c?' sel':'')+'" data-c="'+c+'" style="background:color-mix(in srgb,var(--'+(s.lean>0?'nh':'va')+') '+w+'%,var(--card))">'+c+'<br>'+s.ev+'</button>'}
h+='</div>';
if(sel){const s=S.st[sel],ml=(s.lean>0?"New Horizon +":"Valor +")+Math.abs(s.lean).toFixed(1);
h+='<div class="card"><b>'+sel+'</b> · '+s.ev+' electoral votes · '+ml+'<br><span class="mut">Rally $2M (charisma). TV ad $3M (media reception).</span><p><button id="ra" '+(S.ap<1||S.pm<2?'disabled':'')+'>Hold rally</button> <button id="ad" '+(S.ap<1||S.pm<3?'disabled':'')+'>Buy TV ad</button></p></div>'}
h+='<div class="card"><button id="fd" '+(S.ap<1?'disabled':'')+'>Fundraise</button> <button class="pri" id="ew">End week</button> <button id="nw">Quit</button></div><div class="card" id="log">'+S.log.slice(0,8).map(x=>'<div>'+x+'</div>').join('')+'</div>';
a.innerHTML=h;document.querySelectorAll(".t").forEach(b=>b.onclick=()=>{sel=b.dataset.c;draw()});
const go=t=>()=>{S.ap--;act(t,sel,true);S.log.unshift("You "+(t=="rally"?"held a rally":"bought TV ads")+" in "+sel+".");save();draw()};
if($("ra")){$("ra").onclick=go("rally");$("ad").onclick=go("ad")}
$("fd").onclick=fund;$("ew").onclick=endWeek;$("nw").onclick=()=>{S=null;draw()}}
function elec(){const a=$("app"),res=[];for(const c in S.st){const s=S.st[c],m=s.lean+gauss()*2,tot=s.ev*1.15e6*R(.95,1.05);res.push({c,x:s.x,ev:s.ev,m,n:tot*(.5+m/200),v:tot*(.5-m/200)})}
res.sort((p,q)=>q.x-p.x);let i=0,N=0,V=0,NE=0,VE=0;a.innerHTML='<h1>Election Night</h1><div class="card"><div class="ev"><div id="b1" style="background:var(--nh)"></div><div id="b2" style="background:var(--va);margin-left:auto"></div></div><p id="tl"></p><button id="sk">Skip to result</button></div><div class="card" id="log"></div>';
const step=()=>{const r=res[i++];N+=r.n;V+=r.v;if(r.m>0)NE+=r.ev;else VE+=r.ev;$("b1").style.width=NE/538*100+"%";$("b2").style.width=VE/538*100+"%";
